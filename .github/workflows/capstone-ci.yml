name: Voting App CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Compose configuration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

  build-and-scan:
    name: Build and scan ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: vote
            context: ./vote
          - component: result
            context: ./result
          - component: worker
            context: ./worker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: capstone-${{ matrix.component }}:ci

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: capstone-${{ matrix.component }}:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true

  publish:
    name: Publish ${{ matrix.component }} image to GHCR
    runs-on: ubuntu-latest
    needs: build-and-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: vote
            context: ./vote
          - component: result
            context: ./result
          - component: worker
            context: ./worker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/chinanuuwalaka/example-voting-app-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/chinanuuwalaka/example-voting-app-${{ matrix.component }}:latest
